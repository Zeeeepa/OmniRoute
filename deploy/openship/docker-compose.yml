# ──────────────────────────────────────────────────────────────────────
#  OmniRoute — OpenShip-compatible compose
# ──────────────────────────────────────────────────────────────────────
#  OpenShip's composer validator rejects `build.target` (multi-stage target
#  selection) because it cannot guarantee the requested build stage. This
#  file is the deployment-safe variant: identical services, plain `build`
#  (no target -> Docker uses the final stage = runner-cli, which contains
#  the full image including CLIs), same ports and volumes as the root
#  docker-compose.yml `base` flavor plus the web-cookie browser sidecar.
#
#  OpenShip: Source & Triggers -> "Path to your compose file":
#    deploy/openship/docker-compose.yml
#
#  Local dev workflow is unchanged — use the root docker-compose.yml /
#  docker-compose.prod.yml with their build targets as before.
# ──────────────────────────────────────────────────────────────────────

services:
  # ── Redis (Rate Limiter Backend) ──────────────────────────────────
  redis:
    image: docker.io/library/redis:8.6.5-alpine
    container_name: omniroute-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis-data:/data

  # ── OmniRoute app (final Dockerfile stage = runner-cli) ───────────
  omniroute:
    container_name: omniroute
    build:
      context: .
    image: omniroute:openship
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - PORT=${PORT:-20128}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-20128}
      - API_PORT=${API_PORT:-20129}
      - API_HOST=${API_HOST:-0.0.0.0}
      - LIVE_WS_PORT=${LIVE_WS_PORT:-20132}
      - LIVE_WS_HOST=${LIVE_WS_HOST:-0.0.0.0}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - NODE_OPTIONS=--max-old-space-size=2048
      - CHATGPT_WEB_CODEX_CDP_URL=http://chatgpt-web-codex-browser:9223
      - CDP_PROXY_TOKEN=${CDP_PROXY_TOKEN:-}
      - CDP_PROXY_TOKEN_FILE=/cdp-token/token
    ports:
      - "${APP_BIND_HOST:-0.0.0.0}:${DASHBOARD_PORT:-20128}:${DASHBOARD_PORT:-20128}"
      - "${APP_BIND_HOST:-0.0.0.0}:${API_PORT:-20129}:${API_PORT:-20129}"
      - "${APP_BIND_HOST:-0.0.0.0}:${LIVE_WS_PORT:-20132}:${LIVE_WS_PORT:-20132}"
    volumes:
      - ./data:/app/data
      - chatgpt-web-codex-cdp-token:/cdp-token:ro
      - codex-appserver-token:/run/codex-appserver
      - codex-appserver-home:/home/node/.codex
    depends_on:
      redis:
        condition: service_healthy
      chatgpt-web-codex-browser:
        condition: service_started
    networks:
      - default
      - chatgpt-web-codex-net
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Internal Chromium runtime for ChatGPT Web (Codex) ─────────────
  # No build.target here (dedicated single-stage Dockerfile already).
  chatgpt-web-codex-browser:
    build:
      context: .
      dockerfile: docker/chatgpt-web-codex-browser/Dockerfile
    image: omniroute:chatgpt-web-codex-browser
    restart: unless-stopped
    shm_size: "2gb"
    environment:
      - CDP_PROXY_TOKEN=${CDP_PROXY_TOKEN:-}
      - CDP_PROXY_TOKEN_FILE=/cdp-token/token
    volumes:
      - chatgpt-web-codex-browser-data:/browser-profile
      - chatgpt-web-codex-cdp-token:/cdp-token
    networks:
      - chatgpt-web-codex-net

networks:
  chatgpt-web-codex-net: {}

volumes:
  redis-data:
    name: omniroute-redis-data
  chatgpt-web-codex-browser-data:
    name: omniroute-chatgpt-web-codex-browser-data
  chatgpt-web-codex-cdp-token:
    name: omniroute-chatgpt-web-codex-cdp-token
  codex-appserver-token:
    name: omniroute-codex-appserver-token
  codex-appserver-home:
    name: omniroute-codex-appserver-home
